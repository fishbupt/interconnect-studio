name: Ruff GUI 诊断

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv sync --dev
      - name: Ruff fix diff
        run: |
          uv run ruff check src/interconnect_studio/ui/main_window.py src/interconnect_studio/ui/widgets/plot_widget.py --fix || true
          git diff -- src/interconnect_studio/ui/main_window.py src/interconnect_studio/ui/widgets/plot_widget.py
