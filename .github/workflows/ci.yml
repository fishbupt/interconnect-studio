name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  quality:
    name: 代码质量与测试
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: 设置 Python
        run: uv python install 3.12

      - name: 安装 Qt 运行库
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1

      - name: 安装依赖
        run: uv sync --dev

      - name: Ruff 检查
        run: uv run ruff check .

      - name: Mypy 类型检查
        run: uv run mypy src

      - name: Pytest 测试
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest
